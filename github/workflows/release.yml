name: Build and Release APK

# Запускается только когда вы создаете тег версии, например v1.0.0
on:
  push:
    tags:
      - 'v*'  # Сработает на v1.0, v2.0, v1.2.3 и т.д.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Важно: без этого шага у Actions не будет прав создать Release
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Путь к APK
          files: app/build/outputs/apk/debug/app-debug.apk
          # Автоматически сгенерировать описание изменений
          generate_release_notes: true
          # Сделать этот релиз последним
          make_latest: true
          # Дать файлу красивое имя при скачивании
          # (опционально, замените на свой проект)
          # name: PrivateBrowser-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
